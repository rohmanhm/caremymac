# Pushing a tag like v0.2.0 builds CareMyMac, signs the update, and publishes the GitHub release that installed
# copies find through Sparkle (appcast.xml on the latest release). A release created in the GitHub UI with a new
# tag also triggers this; its notes are kept and the files are attached to it.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}

jobs:
  release:
    runs-on: macos-26
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Release notes
        id: notes
        run: |
          if gh release view "$TAG" --json body --jq .body > notes.md 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$TAG" --jq .body > notes.md
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build, archive and sign the update
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: scripts/release.sh "$TAG" notes.md

      - name: Publish
        run: |
          files=(build/release/CareMyMac-*.zip build/release/appcast.xml)
          if [[ "${{ steps.notes.outputs.exists }}" == true ]]; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" --verify-tag --title "CareMyMac ${TAG#v}" --notes-file notes.md
          fi
